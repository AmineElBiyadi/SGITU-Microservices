services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sgitu_incidents
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 10
    networks:
      - sgitu-network
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=qtU9V62NSW6fSrU0v646RA
    networks:
      - sgitu-network

  minio:
    image: minio/minio:RELEASE.2024-02-17T01-15-57Z
    container_name: sgitu-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sgituadmin
      MINIO_ROOT_PASSWORD: sgitupassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sgitu-network

  minio-create-buckets:
    image: minio/mc:latest
    container_name: sgitu-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 sgituadmin sgitupassword123); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/preuves-incidents;
      /usr/bin/mc policy set private myminio/preuves-incidents;
      exit 0;
      "
    networks:
      - sgitu-network

  gestion-incidents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-gestion-incidents-local
    ports:
      - "8089:8089"
    depends_on:
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:mysql://mysql-db:3306/sgitu_incidents?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Pour contacter G3 (UtilisateurService) qui tourne en local sur le port 8083 (hors Docker)
      - MICROSERVICES_UTILISATEUR_URL=http://host.docker.internal:8083
      - MINIO_ENDPOINT=http://minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sgitu-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: g9-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - sgitu-network
    depends_on:
      - gestion-incidents

  grafana:
    image: grafana/grafana:10.4.0
    container_name: g9-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - sgitu-network
    depends_on:
      - prometheus

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: g9-phpmyadmin
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    networks:
      - sgitu-network
    depends_on:
      - mysql-db

networks:
  sgitu-network:
    driver: bridge

volumes:
  minio_data:
  mysql_data:
