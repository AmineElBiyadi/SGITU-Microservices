name: G10 API Gateway CI

on:
  push:
    paths:
      - "api-gateway/**"
      - ".github/workflows/g10-api-gateway-ci.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - ".github/workflows/g10-api-gateway-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw test

      - name: Build jar
        run: ./mvnw package -DskipTests

      - name: Build Docker image
        run: docker build -t sgitu-g10-api-gateway:ci .
