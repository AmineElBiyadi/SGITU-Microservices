# =============================================================================
# SGITU - Docker Compose global d'integration
#
# Objectif :
# - Tester G10 avec les microservices integres sans modifier les compose locaux
#   des autres groupes.
# - Exposer uniquement la Gateway sur le poste hote.
# - Garder les services metier accessibles seulement via le reseau Docker.
#
# Commandes :
#   docker compose -f docker-compose.integration.yml up -d --build
#   docker compose -f docker-compose.integration.yml logs -f api-gateway
#   docker compose -f docker-compose.integration.yml down
#
# Acces :
#   Gateway     : http://localhost:8080
#   Swagger G10 : http://localhost:8080/swagger-ui.html
#
# Services metier internes :
#   G2 : http://service-abonnement:8082
#   G3 : http://user-service:8083
#   G4 : http://coordination-service:8084
#   G5 : http://notification-service:8085
#   G6 : http://payment-service:8086
#   G7 : http://g7-suivi-vehicules:8087
#   G8 : http://g8-analytics:8088
#   ML : http://ml-service:5000
# =============================================================================

name: sgitu-integration

services:
  # ---------------------------------------------------------------------------
  # G10 - API Gateway & Securite
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sgitu-int-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      TOKEN_BLACKLIST_ENABLED: ${TOKEN_BLACKLIST_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_CONNECT_TIMEOUT_MS: ${GATEWAY_CONNECT_TIMEOUT_MS:-3000}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-5s}
      G8_ANALYTICS_URI: http://g8-analytics:8088
      G8_ML_URI: http://ml-service:5000
    depends_on:
      redis:
        condition: service_started
      user-service:
        condition: service_started
      service-abonnement:
        condition: service_started
      g4-coordination:
        condition: service_started
      notification-service:
        condition: service_started
      payment-service:
        condition: service_started
      g7-service:
        condition: service_started
      g8-analytics:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - api-gateway
          - g10-service
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # G3 - Service Utilisateur
  # ---------------------------------------------------------------------------
  user-service:
    build:
      context: ./service-utilisateur
      dockerfile: Dockerfile
    image: sgitu-int/user-service:latest
    container_name: sgitu-int-user-service
    expose:
      - "8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secret
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Dspring.redis.host=redis -Dspring.redis.port=6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      G8_BASE_URL: http://g8-analytics:8088
    depends_on:
      users-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - user-service
          - g3-user-service
    restart: unless-stopped

  users-db:
    image: postgres:15-alpine
    container_name: sgitu-int-users-db
    expose:
      - "5432"
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - sgitu_int_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgitu-network

  redis:
    image: redis:7-alpine
    container_name: sgitu-int-redis
    expose:
      - "6379"
    networks:
      sgitu-network:
        aliases:
          - redis
          - g3-redis
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # G2 - Service Abonnement
  # ---------------------------------------------------------------------------
  service-abonnement:
    build:
      context: ./service-abonnement
      dockerfile: Dockerfile
      target: runner
    image: sgitu-int/service-abonnement:latest
    container_name: sgitu-int-service-abonnement
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      DB_NAME: abonnement_db
      DB_USER: abonnement
      DB_PASSWORD: abonnement
      SPRING_DATASOURCE_URL: jdbc:mysql://abonnement-db:3306/abonnement_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: abonnement
      SPRING_DATASOURCE_PASSWORD: abonnement
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!}
      UTILISATEUR_SERVICE_URL: http://user-service:8083
      PAIEMENT_SERVICE_URL: http://payment-service:8086
      ANALYSE_SERVICE_URL: http://g8-analytics:8088
      APPLICATION_CONFIG_UTILISATEUR_SERVICE_URL: http://user-service:8083
      APPLICATION_CONFIG_PAIEMENT_SERVICE_URL: http://payment-service:8086
      APPLICATION_CONFIG_ANALYSE_SERVICE_URL: http://g8-analytics:8088
    depends_on:
      abonnement-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - service-abonnement
          - abonnement-service
    restart: unless-stopped

  abonnement-db:
    image: mysql:8.0
    container_name: sgitu-int-abonnement-db
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: abonnement_db
      MYSQL_USER: abonnement
      MYSQL_PASSWORD: abonnement
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - sgitu_int_abonnement_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgitu-network

  # ---------------------------------------------------------------------------
  # G4 - Coordination des transports
  # ---------------------------------------------------------------------------
  g4-coordination:
    build:
      context: ./service-coordination-transport
      dockerfile: Dockerfile
    image: sgitu-int/g4-coordination:latest
    container_name: sgitu-int-g4-coordination
    expose:
      - "8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://g4-postgres:5432/sgitu_g4
      SPRING_DATASOURCE_USERNAME: g4
      SPRING_DATASOURCE_PASSWORD: g4
      JPA_DDL_AUTO: update
      SGITU_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # G4 decode une cle Base64 avant validation. Cette valeur Base64 correspond
      # a la cle brute utilisee par G3/G10 dans cet environnement de test.
      SGITU_JWT_SECRET: ${G4_JWT_SECRET_B64:-U0dJVFVfRzNfSldUX1NFQ1JFVF9LRVlfQ0hBTkdFX01FX0lOX1BST0RVQ1RJT05fMjU2QklUUyEh}
      SGITU_G3_URL: http://user-service:8083
      SGITU_G5_URL: http://api-gateway:8080
      SGITU_G7_URL: http://g7-suivi-vehicules:8087
      SGITU_G9_URL: http://service-gestion-incidents:8089
      SGITU_G10_URL: http://api-gateway:8080
      SGITU_G3_VALIDATION_ENABLED: ${SGITU_G3_VALIDATION_ENABLED:-false}
    depends_on:
      g4-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - coordination-service
          - g4-coordination
          - g4-coordination-service
    restart: unless-stopped

  g4-postgres:
    image: postgres:16-alpine
    container_name: sgitu-int-g4-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: sgitu_g4
      POSTGRES_USER: g4
      POSTGRES_PASSWORD: g4
    volumes:
      - sgitu_int_g4_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g4 -d sgitu_g4"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      sgitu-network:
        aliases:
          - g4-postgres
          - postgres

  # ---------------------------------------------------------------------------
  # G5 - Service Notifications
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ./service-notification
      dockerfile: Dockerfile.integration
    image: sgitu-int/notification-service:latest
    container_name: sgitu-int-notification-service
    expose:
      - "8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!}
      MYSQL_PASSWORD: ${G5_MYSQL_PASSWORD:-notification}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-notification:3306/notifications_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca
      SPRING_DATASOURCE_USERNAME: sgitu
      SPRING_DATASOURCE_PASSWORD: ${G5_MYSQL_PASSWORD:-notification}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-group
      MAIL_HOST: ${G5_MAIL_HOST:-localhost}
      MAIL_PORT: ${G5_MAIL_PORT:-1025}
      MAIL_USERNAME: ${G5_MAIL_USERNAME:-}
      MAIL_PASSWORD: ${G5_MAIL_PASSWORD:-}
      MAIL_FROM: ${G5_MAIL_FROM:-noreply@sgitu.ma}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      mysql-notification:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - notification-service
          - g5-notification-service
          - service-notification
    restart: unless-stopped

  mysql-notification:
    image: mysql:8.0
    container_name: sgitu-int-mysql-notification
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${G5_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: notifications_db
      MYSQL_USER: sgitu
      MYSQL_PASSWORD: ${G5_MYSQL_PASSWORD:-notification}
    volumes:
      - sgitu_int_notification_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${G5_MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      sgitu-network:
        aliases:
          - mysql-notification

  # ---------------------------------------------------------------------------
  # G6 - Service Paiement
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ./service-paiement
      dockerfile: Dockerfile.integration
    image: sgitu-int/payment-service:latest
    container_name: sgitu-int-payment-service
    expose:
      - "8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8086
      SERVER_SSL_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: sgitu
      SPRING_DATASOURCE_PASSWORD: ${G6_MYSQL_PASSWORD:-payment}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!}
      SECURITY_REQUIRE_HTTPS: "false"
      SUBSCRIPTION_SERVICE_URL: http://service-abonnement:8082
      TICKET_SERVICE_URL: http://service-billetterie:8081
      NOTIFICATION_SERVICE_URL: http://api-gateway:8080
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - payment-service
          - g6-payment-service
          - service-paiement
    restart: unless-stopped

  payment-db:
    image: mysql:8.0
    container_name: sgitu-int-payment-db
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${G6_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: payment_db
      MYSQL_USER: sgitu
      MYSQL_PASSWORD: ${G6_MYSQL_PASSWORD:-payment}
    volumes:
      - sgitu_int_payment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${G6_MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      sgitu-network:
        aliases:
          - payment-db

  # ---------------------------------------------------------------------------
  # G7 - Suivi des vehicules
  # ---------------------------------------------------------------------------
  g7-service:
    build:
      context: ./service-suivi-vehicule
      dockerfile: Dockerfile
    image: sgitu-int/g7-suivi-vehicules:latest
    container_name: sgitu-int-g7-suivi-vehicules
    expose:
      - "8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://g7-postgres:5432/g7_vehicules
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      G9_INTEGRATION_URL: http://service-gestion-incidents:8089/api/v1/incidents
      G5_NOTIFICATION_URL: http://api-gateway:8080/api/notifications/send
    depends_on:
      g7-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      sgitu-network:
        aliases:
          - g7-suivi-vehicules
          - g7-service
          - service-suivi-vehicule
    restart: unless-stopped

  g7-postgres:
    image: postgres:15-alpine
    container_name: sgitu-int-g7-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: g7_vehicules
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sgitu_int_g7_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d g7_vehicules"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      sgitu-network:
        aliases:
          - g7-postgres

  # ---------------------------------------------------------------------------
  # G8 - Analyse & donnees
  # ---------------------------------------------------------------------------
  g8-analytics:
    build:
      context: ./service-analytique
      dockerfile: Dockerfile
    image: sgitu-int/g8-analytics:latest
    container_name: sgitu-int-g8-analytics
    expose:
      - "8088"
    environment:
      MONGO_URI: mongodb://g8-mongodb:27017/g8_analytics
      ML_SERVICE_URL: http://ml-service:5000
      G5_NOTIFICATION_URL: http://api-gateway:8080/api/notifications/send
    depends_on:
      g8-mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      sgitu-network:
        aliases:
          - g8-analytics
          - g8-analytics-service
    restart: unless-stopped

  g8-mongodb:
    image: mongo:7.0
    container_name: sgitu-int-g8-mongodb
    expose:
      - "27017"
    environment:
      MONGO_INITDB_DATABASE: g8_analytics
    volumes:
      - sgitu_int_g8_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      sgitu-network:
        aliases:
          - g8-mongodb
          - mongodb

  ml-service:
    build:
      context: ./service-analytique/ml-service
      dockerfile: Dockerfile
    image: sgitu-int/ml-service:latest
    container_name: sgitu-int-ml-service
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      sgitu-network:
        aliases:
          - ml-service
          - g8-ml-service
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Infrastructure commune
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: sgitu-int-kafka
    expose:
      - "9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      sgitu-network:
        aliases:
          - kafka

  # ---------------------------------------------------------------------------
  # Monitoring optionnel pour les tests d'integration
  # Lancer avec :
  #   docker compose -f docker-compose.integration.yml --profile monitoring up -d
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: sgitu-int-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sgitu-network

  grafana:
    image: grafana/grafana:latest
    container_name: sgitu-int-grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - sgitu_int_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - sgitu-network

networks:
  sgitu-network:
    name: sgitu-network
    driver: bridge

volumes:
  sgitu_int_users_data:
  sgitu_int_abonnement_data:
  sgitu_int_g4_data:
  sgitu_int_notification_data:
  sgitu_int_payment_data:
  sgitu_int_g7_data:
  sgitu_int_g8_mongo_data:
  sgitu_int_grafana_data:
