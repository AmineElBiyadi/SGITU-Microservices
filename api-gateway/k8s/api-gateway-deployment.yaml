apiVersion: v1
kind: Namespace
metadata:
  name: sgitu
---
apiVersion: v1
kind: Secret
metadata:
  name: g10-api-gateway-secret
  namespace: sgitu
type: Opaque
stringData:
  JWT_SECRET: "SGITU_G3_JWT_SECRET_KEY_CHANGE_ME_IN_PRODUCTION_256BITS!!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: g10-api-gateway-config
  namespace: sgitu
data:
  SPRING_PROFILES_ACTIVE: "docker"
  TOKEN_BLACKLIST_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  GATEWAY_CONNECT_TIMEOUT_MS: "3000"
  GATEWAY_RESPONSE_TIMEOUT: "5s"
  G8_ANALYTICS_URI: "http://g8-analytics:8088"
  G8_ML_URI: "http://ml-service:5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g10-api-gateway
  namespace: sgitu
  labels:
    app: g10-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: g10-api-gateway
  template:
    metadata:
      labels:
        app: g10-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: sgitu-microservices-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: g10-api-gateway-config
            - secretRef:
                name: g10-api-gateway-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: g10-api-gateway
  namespace: sgitu
spec:
  type: NodePort
  selector:
    app: g10-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
