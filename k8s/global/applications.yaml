spec:
  replicas: 1
  selector:
    matchLabels:
      app: g4-coordination
  template:
    metadata:
      labels:
        app: g4-coordination
    spec:
      containers:
        - name: g4-coordination
          image: g4-coordination:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8084"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://g4-postgres:5432/sgitu_g4
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: g4_DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: g4_DB_PASSWORD
            - name: JPA_DDL_AUTO
              value: update
            - name: SGITU_KAFKA_ENABLED
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SGITU_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: G4_JWT_SECRET_B64
            - name: SGITU_G3_URL
