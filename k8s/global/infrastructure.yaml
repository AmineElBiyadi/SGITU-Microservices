apiVersion: apps/v1
kind: Deployment
metadata:
  name: billetterie-mongo
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billetterie-mongo
  template:
    metadata:
      labels:
        app: billetterie-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: billetterie_MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: billetterie_MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: billetterie_MONGO_DATABASE
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: billetterie-mongo
  namespace: sgitu
spec:
  selector:
    app: billetterie-mongo
  ports:
    - port: 27017
      targetPort: 27017
