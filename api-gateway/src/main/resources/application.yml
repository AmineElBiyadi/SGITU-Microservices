server:
  port: 8080

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

  cloud:
    gateway:
      enabled: true
      handler-mapping:
        order: -1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: g1-billetterie
          uri: http://service-billetterie:8081
          predicates:
            - Path=/api/v1/tickets,/api/v1/tickets/**,/api/v1/admin/tickets,/api/v1/admin/tickets/**,/api/v1/admin/dashboard,/api/v1/ticket-types,/api/v1/ticket-types/**

        - id: g2-abonnements
          uri: http://service-abonnement:8082
          predicates:
            - Path=/api/abonnements,/api/abonnements/**,/api/plans,/api/plans/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        - id: g3-auth
          uri: http://user-service:8083
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/(?<segment>.*), /api/$\{segment}

        - id: g3-utilisateurs
          uri: http://user-service:8083
          predicates:
            - Path=/api/users,/api/users/**,/api/profiles,/api/profiles/**

        - id: g4-coordination
          uri: http://coordination-service:8084
          predicates:
            - Path=/api/g4,/api/g4/**,/api/v1/operator/status

        - id: g5-notifications
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications,/api/notifications/**

        - id: g6-paiement
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments,/api/payments/**,/api/refunds,/api/refunds/**,/api/payment-accounts,/api/payment-accounts/**,/api/invoices,/api/invoices/**,/api/test-cards,/api/test-mobile-money-accounts,/api/health
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        - id: g7-suivi-vehicules
          uri: http://g7-suivi-vehicules:8087
          predicates:
            - Path=/api/suivi-vehicules/**

        - id: g8-analytics
          uri: ${G8_ANALYTICS_URI:http://g8-analytics:8088}
          predicates:
            - Path=/api/v1/ingestion/**,/api/v1/analytics/**

        - id: g8-ml-predictions
          uri: ${G8_ML_URI:http://ml-service:5000}
          predicates:
            - Path=/predict/peak-hours,/predict/incidents

        - id: g9-incidents
          uri: http://service-gestion-incidents:8089
          predicates:
            - Path=/api/incidents/**,/api/rapports/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

jwt:
  secret: ${JWT_SECRET:G10_SECRET_KEY_SGITU_2025_SUPER_SECURE_KEY_32CHARS}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/api-gateway.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.agileflow.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
  logback:
    rollingpolicy:
      file-name-pattern: logs/api-gateway-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

---
# Profil Docker : surcharge des URLs pour conteneurs
spring:
  config:
    activate:
      on-profile: docker
