# =============================================================================
#  SGITU - Groupe 10 uniquement
#  Lance l'API Gateway sans base metier locale.
#  G3 reste la source de verite des comptes, roles et JWT.
#  A executer depuis le dossier api-gateway avec : docker compose up -d --build
# =============================================================================

networks:
  sgitu-g10-network:
    driver: bridge

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgitu-g10-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: G10_SECRET_KEY_SGITU_2025_SUPER_SECURE_KEY_32CHARS
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 604800000
    networks:
      - sgitu-g10-network
    restart: unless-stopped
