apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: g9-hpa
  namespace: service-gestion-incidents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: g9-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
