                  key: JWT_SECRET
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: MAIL_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: MAIL_FROM
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
