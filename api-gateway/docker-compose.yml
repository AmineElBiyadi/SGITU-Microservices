# =============================================================================
#  SGITU - Groupe 10 uniquement
#  Lance l'API Gateway sans base metier locale.
#  G3 reste la source de verite des comptes, roles et JWT.
#  A executer depuis le dossier api-gateway avec : docker compose up -d --build
# =============================================================================

networks:
  sgitu-network:
    name: sgitu-network
    driver: bridge

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgitu-g10-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-G10_SECRET_KEY_SGITU_2025_SUPER_SECURE_KEY_32CHARS}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      G8_ANALYTICS_URI: ${G8_ANALYTICS_URI:-http://g8-analytics:8088}
      G8_ML_URI: ${G8_ML_URI:-http://ml-service:5000}
    networks:
      - sgitu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
