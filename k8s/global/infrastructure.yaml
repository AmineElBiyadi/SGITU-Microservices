            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: abonnement_DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: abonnement_DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: abonnement_DB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db-abonnement
  namespace: sgitu
