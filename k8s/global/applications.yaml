apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: sgitu-g10-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: JWT_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: JWT_REFRESH_EXPIRATION
            - name: TOKEN_BLACKLIST_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: TOKEN_BLACKLIST_ENABLED
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: GATEWAY_CONNECT_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: GATEWAY_CONNECT_TIMEOUT_MS
            - name: GATEWAY_RESPONSE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: GATEWAY_RESPONSE_TIMEOUT
            - name: G8_ANALYTICS_URI
              value: http://g8-analytics-service:8088
            - name: G8_ML_URI
              value: http://g8-ml-service:5000
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sgitu
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

