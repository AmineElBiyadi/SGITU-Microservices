apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-billetterie
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-billetterie
  template:
    metadata:
      labels:
        app: service-billetterie
    spec:
      containers:
        - name: service-billetterie
          image: service-billetterie:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: MONGO_URI
              value: mongodb://admin:admin@billetterie-mongo:27017/billetterie_db?authSource=admin
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8086
            - name: COORDINATION_SERVICE_URL
              value: http://g4-coordination:8084
---
apiVersion: v1
kind: Service
metadata:
  name: service-billetterie
  namespace: sgitu
spec:
  selector:
    app: service-billetterie
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abonnement-service
  namespace: sgitu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abonnement-service
  template:
    metadata:
      labels:
        app: abonnement-service
    spec:
      containers:
        - name: abonnement-service
          image: raihana10m/service-abonnement:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sgitu-config
                  key: abonnement_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: abonnement_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: abonnement_DB_PASSWORD
            - name: UTILISATEUR_SERVICE_URL
              value: http://user-service:8083
            - name: PAIEMENT_SERVICE_URL
              value: http://payment-service:8086
            - name: ANALYSE_SERVICE_URL
              value: http://g8-analytics-service:8088
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sgitu-secrets
                  key: JWT_SECRET
---
