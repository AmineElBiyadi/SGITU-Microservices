              value: http://notification-service:8085
            - name: SGITU_G10_URL
              value: http://api-gateway:8080
            - name: SGITU_G7_URL
              value: http://g7-service:8087
            - name: SGITU_G1_URL
              value: http://service-billetterie:8081
